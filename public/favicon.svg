<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Sunset gradient background -->
    <radialGradient id="bg" cx="50%" cy="70%" r="70%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>
    <!-- Warm glow for music notes -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>

  <!-- Bus body -->
  <rect x="6" y="28" width="52" height="22" rx="4" ry="4" fill="#7f1d1d" opacity="0.95"/>

  <!-- Bus roof -->
  <rect x="9" y="23" width="46" height="8" rx="3" ry="3" fill="#991b1b"/>

  <!-- Windshield / front glass -->
  <rect x="10" y="25" width="12" height="5" rx="1.5" fill="#fde68a" opacity="0.85"/>

  <!-- Side windows row -->
  <rect x="25" y="25" width="8" height="5" rx="1" fill="#fde68a" opacity="0.75"/>
  <rect x="35" y="25" width="8" height="5" rx="1" fill="#fde68a" opacity="0.75"/>
  <rect x="45" y="25" width="8" height="5" rx="1" fill="#fde68a" opacity="0.75"/>

  <!-- Door outline -->
  <rect x="47" y="33" width="8" height="12" rx="2" fill="#991b1b" stroke="#fde68a" stroke-width="0.6" opacity="0.8"/>

  <!-- Wheels -->
  <circle cx="17" cy="51" r="5.5" fill="#1c1917"/>
  <circle cx="17" cy="51" r="2.5" fill="#44403c"/>
  <circle cx="47" cy="51" r="5.5" fill="#1c1917"/>
  <circle cx="47" cy="51" r="2.5" fill="#44403c"/>

  <!-- Undercarriage bar -->
  <rect x="8" y="49" width="48" height="2" rx="1" fill="#57534e"/>

  <!-- Musical note 1 (eighth note) — top right area -->
  <g filter="url(#glow)" fill="#fef08a" opacity="0.95">
    <!-- stem -->
    <rect x="40" y="6" width="2" height="10" rx="1"/>
    <!-- flag -->
    <path d="M42 6 Q48 8 46 13" stroke="#fef08a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- note head -->
    <ellipse cx="39" cy="16" rx="3" ry="2.2" transform="rotate(-20 39 16)"/>
  </g>

  <!-- Musical note 2 (quarter note) — smaller, offset -->
  <g filter="url(#glow)" fill="#fdba74" opacity="0.85">
    <rect x="51" y="9" width="1.8" height="8" rx="0.9"/>
    <ellipse cx="50.1" cy="17" rx="2.5" ry="1.8" transform="rotate(-20 50 17)"/>
  </g>
</svg>
